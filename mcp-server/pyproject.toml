[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchpipe-mcp"
version = "1.0.0"
description = "SearchPipe MCP server for developers building AI agents — local stdio proxy over the SearchPipe web search API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp==1.16.0",
    "httpx==0.28.1",
    "pydantic>=2.8,<2.14",
]

[project.scripts]
searchpipe-mcp = "searchpipe_mcp.server:main"

[project.urls]
Homepage = "https://searchpipe.tech"
Repository = "https://github.com/SearchPipe/searchpipe-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/searchpipe_mcp"]
