[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-searchpipe"
version = "0.1.0"
description = "An integration package connecting SearchPipe and LangChain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SearchPipe", email = "hello@searchpipe.tech" },
]
keywords = ["langchain", "search", "searchpipe", "retriever", "tool", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://searchpipe.tech"
Documentation = "https://searchpipe.tech/docs"
Repository = "https://github.com/SearchPipe/searchpipe-mcp"
"Bug Tracker" = "https://github.com/SearchPipe/searchpipe-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_searchpipe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
